name: build

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      node_ref:
        description: 'Node.js Git Branch or Tag (e.g., v24.x, v22.x)'
        required: true
        default: 'v24.21.0'

jobs:
  build-x86:
    runs-on: ubuntu-latest
    timeout-minutes: 500
    container:
      image: ghcr.io/eebssk1/debian-trixie:latest
      # /root -> /user 是 swap.sh 建立容器->宿主机免密 ssh 的前提
      options: --privileged --volume /root:/user
    steps:
      - name: updateNinstall
        run: |
          apt-get -y update && apt-get -y upgrade --autoremove --purge
          apt-get -y install curl python3 ninja-build bzip2 tar xz-utils git pkg-config cmake openssh-client iproute2

      - name: checkout ci scripts
        uses: actions/checkout@v4

      - name: host tuning (swap/sysctl/zswap)
        # swap.sh 通过 ssh root@<docker 网关> 到宿主机做 vm.*/zswap/sched 调优。
        # 依赖：容器 options 里的 --volume /root:/user（否则脚本打印提示后 exit 0，
        # 不做任何调优）；以及宿主机 sshd 允许 root 公钥登录（首次会自动写入
        # /user/.ssh/authorized_keys）。托管 runner 上 sshd 不可达时不应阻塞构建。
        continue-on-error: true
        run: |
          sh ./swap.sh
          echo "--- swap state (kernel-global) ---"
          swapon --show || true
          free -h
          # swap.sh 依赖宿主机 sshd（自托管 runner 场景）。托管 runner 上通常连不上，
          # 本步骤会因 continue-on-error 而放行，但那样就没有 7G swap，
          # 后面 --enable-lto 的链接阶段大概率被 OOM killer 杀掉，故此处显式告警。
          if ! swapon --show | grep -q swap; then
            echo "::warning::no active swap detected - GCC LTO link may OOM (exit 137)"
          fi

      - name: load toolchain
        run: curl -sL "https://github.com/eebssk1/aio_tc_build/releases/latest/download/x86_64-linux-gnu-native.tb2" | tar -C /opt --bz -x

      - name: build mimalloc
        # THP 注意：不要加 -DMI_NO_THP=ON 或 -DMI_ALLOW_THP=OFF（等效：运行时
        # MIMALLOC_ALLOW_THP=0）——那会执行进程级 prctl(PR_SET_THP_DISABLE,1)，
        # 使 Node 运行时 --use-largepages 对 .text 段的 madvise(MADV_HUGEPAGE) 静默失效。
        # v3.5.3 在 Linux 下默认 MI_ALLOW_THP=FULL（MI_DEFAULT_ALLOW_THP=2，已实测），
        # 不会禁用 THP，且 mimalloc 堆与 Node .text 段互不重叠，两者可安全共存。
        # MI_OPT_ARCH=ON 会给 mimalloc 注入 -march=haswell（+avx2），与下方 Node 主
        # flags 的 -march=haswell 一致，产物最低 CPU 要求同为 Haswell，无额外约束。
        run: |
          export PATH=/opt/x86_64-linux-gnu/bin:$PATH
          git -c advice.detachedHead=false clone --depth=1 -b v3.5.3 https://github.com/microsoft/mimalloc.git mimalloc-src
          cmake -B mimalloc-src/build -S mimalloc-src \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-Wa,-O2 -D__1ENABLE_AGGRESSIVE_GRAPHITE9__ -fno-math-errno -falign-loops=32:16:16:11 -flimit-function-alignment -ffunction-sections -fdata-sections" \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=TRUE \
            -DCMAKE_AR="gcc-ar" \
            -DCMAKE_NM="gcc-nm" \
            -DCMAKE_USER_MAKE_RULES_OVERRIDE="$PWD/fix_lto.cmake" \
            -DMI_BUILD_SHARED=OFF \
            -DMI_BUILD_STATIC=ON \
            -DMI_BUILD_OBJECT=OFF \
            -DMI_BUILD_TESTS=OFF \
            -DMI_OVERRIDE=ON \
            -DMI_OPT_ARCH=ON \
            -DMI_OPT_SIMD=ON
          cmake --build mimalloc-src/build -j$(nproc)

      - name: checkout nodejs
        uses: actions/checkout@v4
        with:
          repository: nodejs/node
          ref: ${{ github.event.inputs.node_ref || 'v24.21.0' }}
          path: node-src

      - name: build (GCC PGO + LTO)
        working-directory: node-src
        run: |
          set -eu
          export PATH="/opt/x86_64-linux-gnu/bin:$PATH"
          export CC="gcc"
          export CXX="g++"
          export AR="gcc-ar"
          export NM="gcc-nm"

          export F="-O3 -Wa,-O2 -D__1ENABLE_AGGRESSIVE_GRAPHITE9__ -fno-math-errno -march=haswell -mtune=broadwell -fipa-reorder-for-locality -flimit-function-alignment -falign-loops=32:16:16:11 -ffunction-sections -fdata-sections"
          # Keep profiles outside out/: rebuild in the SAME path with the SAME
          # compiler/source/CPU flags. GCC keys .gcda files by object output path.
          export PGO_DIR="$GITHUB_WORKSPACE/pgo-data"
          rm -rf out "$PGO_DIR"
          mkdir -p "$PGO_DIR"
          gcc --version
          g++ --version

          # Anchor malloc before scanning libmimalloc.a. This extracts only the archive
          # dependency closure instead of forcing every member in with --whole-archive.
          # The push/pop state also prevents -Bstatic from affecting glibc and other libs.
          export MI_LIB_DIR="$GITHUB_WORKSPACE/mimalloc-src/build"
          test -f "$MI_LIB_DIR/libmimalloc.a"
          echo "mimalloc archive: $MI_LIB_DIR/libmimalloc.a"
          for runtime_archive in libstdc++.a libgcc.a libgcc_eh.a; do
            runtime_path=$(g++ -print-file-name="$runtime_archive")
            if test "$runtime_path" = "$runtime_archive" || ! test -f "$runtime_path"; then
              echo "static GCC runtime archive not found: $runtime_archive" >&2
              exit 1
            fi
            echo "$runtime_archive: $runtime_path"
          done
          export LDFLAGS="-Wl,--undefined=malloc,--undefined=free,--undefined=calloc -L$MI_LIB_DIR -Wl,--push-state,-Bstatic -lmimalloc -Wl,--pop-state"
          export LDFLAGS="$LDFLAGS -static-libstdc++ -static-libgcc -Wl,--gc-sections -lpthread -lrt -Wl,-O3"
          export LDFLAGS="$LDFLAGS -Wl,--export-dynamic-symbol=malloc -Wl,--export-dynamic-symbol=calloc -Wl,--export-dynamic-symbol=realloc -Wl,--export-dynamic-symbol=free -Wl,--export-dynamic-symbol=posix_memalign -Wl,--export-dynamic-symbol=aligned_alloc -Wl,--export-dynamic-symbol=malloc_usable_size"
          BASE_LDFLAGS="$LDFLAGS"

          # Node's configure switch supplies -fprofile-generate to compilation
          # AND linking. Atomic counters are required for V8/libuv/worker threads.
          export CFLAGS="$F -fprofile-dir=$PGO_DIR -fprofile-update=atomic"
          export CXXFLAGS="$CFLAGS"
          export LDFLAGS="$BASE_LDFLAGS -fprofile-dir=$PGO_DIR -fprofile-update=atomic"
          ./configure \
            --ninja \
            --dest-cpu=x64 \
            --enable-lto \
            --enable-pgo-generate

          # Build only node and its prerequisites, not untrained test executables.
          ninja -C out/Release -j$(nproc) node

          # GCC merges .gcda counters at normal process exit; do not use LLVM
          # profraw/profdata tools or accept a killed/failed training process.
          export TMPDIR="$PGO_DIR/tmp"
          mkdir -p "$TMPDIR"
          : > "$PGO_DIR/training.log"
          if test -f tools/pgo/pgo-run-all.js; then
            # Reuse this Node revision's built-in workloads directly. The upstream
            # orchestrator's data check expects LLVM .profraw, not GCC .gcda.
            export PGO_TRAINING_DURATION=15000
            for workload in http-server json crypto streams-buffers fs async-patterns url-string compression net module-loading child-workers; do
              echo "PGO workload: $workload" | tee -a "$PGO_DIR/training.log"
              if ! timeout --kill-after=10s 5m env -u LD_LIBRARY_PATH \
                "$PWD/out/Release/node" "tools/pgo/pgo-$workload.js" \
                >> "$PGO_DIR/training.log" 2>&1; then
                cat "$PGO_DIR/training.log"
                echo "::error::PGO workload failed or timed out: $workload"
                exit 1
              fi
            done
          else
            # Older refs (including older Node 22 tags) may not ship tools/pgo.
            echo "PGO: using the built-in-module fallback workload"
            if ! timeout --kill-after=10s 15m env -u LD_LIBRARY_PATH \
              "$PWD/out/Release/node" "$GITHUB_WORKSPACE/scripts/pgo-train.cjs" \
              >> "$PGO_DIR/training.log" 2>&1; then
              cat "$PGO_DIR/training.log"
              echo "::error::PGO fallback training failed or timed out"
              exit 1
            fi
          fi
          cat "$PGO_DIR/training.log"
          if grep -Eq 'libgcov profiling error|profiling:.*(cannot|Cannot|error)' "$PGO_DIR/training.log"; then
            echo "::error::GCC could not write/merge PGO data"
            exit 1
          fi
          profile_count=$(find "$PGO_DIR" -type f -name '*.gcda' -size +0c | wc -l)
          echo "PGO: $profile_count nonempty profile files"
          if test "$profile_count" -eq 0; then
            echo "::error::no Node runtime PGO data collected"
            exit 1
          fi
          for unit in node_main node node_buffer isolate; do
            if ! find "$PGO_DIR" -type f -name "*$unit.gcda" -size +0c -print -quit | grep -q .; then
              echo "::error::required runtime PGO data missing: $unit"
              exit 1
            fi
          done

          # Remove ALL instrumented objects, but retain profiles and build paths.
          # Archive members not extracted at link time legitimately lack profiles.
          # Keep those warnings visible, require core profiles above, and treat
          # source/profile mismatches as errors. Partial training keeps unvisited
          # functions in valid profiles optimized instead of optimizing for size.
          rm -rf out
          PGO_USE_FLAGS="-fprofile-dir=$PGO_DIR -fprofile-partial-training -Wmissing-profile -Werror=coverage-mismatch"
          export CFLAGS="$F $PGO_USE_FLAGS"
          export CXXFLAGS="$CFLAGS"
          export LDFLAGS="$BASE_LDFLAGS $PGO_USE_FLAGS"
          ./configure \
            --ninja \
            --dest-cpu=x64 \
            --enable-lto \
            --enable-pgo-use
          ninja -C out/Release -j$(nproc) node

          nm --defined-only out/Release/node > "$PGO_DIR/final-symbols.txt"
          if grep -Eq '[[:space:]]__gcov_(init|exit)$|[[:space:]]__gcov0[.]' "$PGO_DIR/final-symbols.txt"; then
            echo "::error::final Node binary still contains PGO instrumentation"
            exit 1
          fi

          # Verify the final ELF, not just the requested linker flags.
          # libstdc++, libgcc and mimalloc must not remain as dynamic dependencies.
          readelf -d out/Release/node | grep NEEDED | tee /tmp/node-needed.txt
          if grep -Eq 'lib(mimalloc|stdc\+\+|gcc_s)\.so' /tmp/node-needed.txt; then
            echo "unexpected dynamic allocator/compiler runtime dependency" >&2
            exit 1
          fi

          # mimalloc's public and override entry points must resolve to identical code.
          malloc_addr=$(nm -n --defined-only out/Release/node | awk '$3 == "malloc" { print $1; exit }')
          mi_malloc_addr=$(nm -n --defined-only out/Release/node | awk '$3 == "mi_malloc" { print $1; exit }')
          free_addr=$(nm -n --defined-only out/Release/node | awk '$3 == "free" { print $1; exit }')
          mi_free_addr=$(nm -n --defined-only out/Release/node | awk '$3 == "mi_free" { print $1; exit }')
          test -n "$malloc_addr" && test "$malloc_addr" = "$mi_malloc_addr"
          test -n "$free_addr" && test "$free_addr" = "$mi_free_addr"

          # The binary must run without help from the toolchain's shared-library path.
          env -u LD_LIBRARY_PATH out/Release/node --version

          # 正确用法：--dest-dir 相当于 DESTDIR，--prefix "" 使其成为最终根
          python3 tools/install.py install --dest-dir "$PWD/dist" --prefix ""

      - name: pack
        run: |
          mv node-src/dist node-x86
          tar --bz -cf node-lts-x86.tb2 -C $PWD node-x86

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: node-lts-x86
          path: "node-x86/*"

      - name: delete tag if exists
        uses: ClementTsang/delete-tag-and-release@v0.4.0
        continue-on-error: true
        with:
          delete_release: true
          tag_name: ${{ github.event.inputs.node_ref || 'v24.21.0' }}

      - name: release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: "*.tb2"
          commit: main
          makeLatest: true
          tag: ${{ github.event.inputs.node_ref || 'v24.21.0' }}
